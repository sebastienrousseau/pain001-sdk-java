# SPDX-License-Identifier: Apache-2.0 OR MIT
name: Bug report
description: Report a reproducible problem in pain001-sdk-java
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: >-
        Issues are public. Use synthetic data only: never paste real
        account numbers, personal data or bank-restricted material. Report
        a vulnerability privately as SECURITY.md describes, not here.
  - type: input
    id: version
    attributes:
      label: pain001-sdk-java version
      placeholder: "0.0.87"
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: pain001 server version (from health())
      placeholder: "0.0.87"
    validations:
      required: true
  - type: dropdown
    id: java_version
    attributes:
      label: Java version
      options:
        - "17"
        - "21"
        - Other (say which in the description)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: The smallest input and code that show the problem.
      render: java
    validations:
      required: true
  - type: textarea
    id: error_output
    attributes:
      label: Error output
      render: text
