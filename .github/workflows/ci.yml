# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint, build, unit tests and the 100 % coverage gate on Java 17 and 21;
# the benchmark smoke run; the API breakage check; then the regression
# run (scripts/regression.sh, the same as `make regression`): every gate,
# the conformance kit, every example and the benchmark smoke run against
# a real `pain001 serve` installed from the hash-pinned
# ci/server-requirements.txt. Maven comes from ./mvnw (3.10.0, SHA-256
# checked) and every artifact it resolves must match .mvn/checksums/.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Every file states the same version
        run: scripts/verify-release-versions

      - name: Whitespace format and file size
        run: make format-check size

      - name: javac -Xlint:all -Werror and PMD complexity ceilings
        run: make lint

  test:
    name: Build, unit tests and coverage (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Every local gate (live tests skip here; JaCoCo fails below 100 %)
        run: make check

      - name: Coverage report
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  bench:
    name: Benchmarks smoke run (client-side)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Every client-side benchmark once (not asserted)
        run: make bench-smoke

  api:
    name: API breakage against the last release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # japicmp against the latest com.pain001:pain001-sdk on Maven
      # Central. Until the first release is published there is nothing to
      # compare with, and `make api-check` says so and passes.
      - name: japicmp
        run: make api-check

  conformance:
    name: Regression run against pain001 serve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the server (hash-pinned)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/srv"
          "$RUNNER_TEMP/srv/bin/python" -m pip install --require-hashes -r ci/server-requirements.txt

      - name: Gate, conformance kit (none skipped), examples, benchmark smoke
        env:
          PAIN001_SERVER: ${{ runner.temp }}/srv/bin/pain001
        run: make regression
