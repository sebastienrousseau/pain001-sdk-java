# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual: MkDocs Material from docs/ (strict, so a broken nav
# entry or snippet fails), with the Javadoc (doclint all, warnings fail)
# under /api/. Built on every pull request; deployed to GitHub Pages from
# main by the official Pages actions (AGENTS.md 7.1.3). Pages must be set
# to "GitHub Actions" in the repository settings before the first deploy
# (see DEVELOPMENT.md); until then the deploy job fails and the build
# job still gates.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # --require-hashes: only the reviewed bytes install.
      - name: Install MkDocs Material (hash-pinned)
        run: python -m pip install --disable-pip-version-check --require-hashes -r docs/requirements.txt

      - name: Manual and Javadoc
        run: make manual DOCS_PY=python

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
