#
# Bounded fuzzing on every pull request: each Jazzer target runs for 60
# seconds in fuzzing mode (JAZZER_FUZZ=1), starting from its committed
# seeds. The same targets run their seeds as regression tests in
# `make check`. A finding fails the job and its crashing input is
# uploaded; commit it under src/fuzz/resources as a regression seed with
# the fix.
name: Fuzz

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [ResponseDecodingFuzzTest, ClientResponseFuzzTest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Fuzz for 60 seconds
        env:
          TARGET: ${{ matrix.target }}
        run: make fuzz FUZZ_TARGETS="$TARGET" FUZZ_TIME=60s

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: |
            src/fuzz/resources/com/pain001/sdk/**/crash-*
            src/test/resources/**/crash-*
            crash-*
          if-no-files-found: ignore
