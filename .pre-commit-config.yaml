#
# Fast local checks before each commit (`pre-commit install`). They call
# the same make targets CI runs; local hooks only, so nothing is fetched
# from a third-party repository. The full gate is still `make check`.
repos:
  - repo: local
    hooks:
      - id: format-check
        name: whitespace format and file size
        entry: make format-check size
        language: system
        pass_filenames: false
        files: \.(java|xml)$
      - id: verify-release-versions
        name: every file states the same version
        entry: scripts/verify-release-versions
        language: system
        pass_filenames: false
      - id: reuse
        name: REUSE (SPDX on every file)
        entry: reuse lint
        language: system
        pass_filenames: false
      - id: codespell
        name: codespell
        entry: codespell
        language: system
        types: [text]
